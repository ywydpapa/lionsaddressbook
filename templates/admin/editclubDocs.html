<!DOCTYPE html>
<html lang="en">
<head>
    {% include '/comm/adheader.html' %}
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        #editor-container {
            height: 300px;
        }
    </style>
</head>
<body id="page-top">
<!-- Page Wrapper -->
<div id="wrapper">
    {% include '/comm/sidebar.html' %}
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
        <!-- Main Content -->
        <div id="content">
            {% include '/comm/adtopbar.html' %}
            <!-- Begin Page Content -->
            <div class="container-fluid">
                <!-- Page Heading -->
                <h1 class="h3 mb-4 text-gray-800">클럽 문서 수정</h1>
                <div class="d-flex justify-content-center" style="min-height: 100vh;">
                    <div class="col-md-9">
                        <table class="table table-bordered text-center">
                            <thead>
                            </thead>
                            <tbody>
                            <form method="POST" id="editor-form" action="/updateclubdoc/{{docdtl[1]}}">
                                <tr>
                                    <td>클럽명</td>
                                    <td><input type="text" class="form-control" name="clubname"
                                               value="{{ docdtl[9]}}" readonly/><input type="hidden" class="form-control" id="clubno" name="clubno"
                                               value="{{ docdtl[1]}}" readonly/></td>
                                </tr>
                                <tr>
                                    <td>문서명</td>
                                    <td>
                                        <div class="row">
                                            <div class="float-left"><select name="doctype" id="doctype"
                                                                            class="form-control"
                                                                            onchange="updateTitle()">
                                                <option value="0" {% if docdtl[2] == 0 %} selected {% endif %}>클럽헌장</option>
                                                <option value="1" {% if docdtl[2] == 1 %} selected {% endif %}>클럽조직도</option>
                                                <option value="100" {% if docdtl[2] == 100 %} selected {% endif %}>직접입력</option>
                                                <option value="101" {% if docdtl[2] == 101 %} selected {% endif %}>직접입력</option>
                                                <option value="102" {% if docdtl[2] == 102 %} selected {% endif %}>직접입력</option>
                                                <option value="103" {% if docdtl[2] == 103 %} selected {% endif %}>직접입력</option>
                                                <option value="104" {% if docdtl[2] == 104 %} selected {% endif %}>직접입력</option>
                                                <option value="105" {% if docdtl[2] == 105 %} selected {% endif %}>직접입력</option>
                                                <option value="106" {% if docdtl[2] == 106 %} selected {% endif %}>직접입력</option>
                                                <option value="107" {% if docdtl[2] == 107 %} selected {% endif %}>직접입력</option>
                                                <option value="108" {% if docdtl[2] == 108 %} selected {% endif %}>직접입력</option>
                                                <option value="109" {% if docdtl[2] == 109 %} selected {% endif %}>직접입력</option>
                                            </select></div>
                                            <div class="float-right"><input type="text" class="form-control"
                                                                            name="title" id="title"
                                                                            value="{{ docdtl[3] }}" required/></div>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <h4>문서 내용을 아래에 입력하세요.</h4>
                                        <div id="editor-container">{{ docdtl[4] | safe }}</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="2">
                                        <div class="col-12"
                                             style="display: flex; justify-content: space-between; gap: 10px;">
                                            <a href="#" onclick="window.location.href='/clubList'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">클럽목록으로 돌아가기</a>
                                            <a href="#"
                                               onclick="window.location.href='/editclub/{{docdtl[1]}}'; return false;"
                                               class="btn btn-dark"
                                               role="button" style="flex: 0 0 30%;">클럽관리로 돌아가기</a>
                                            <button type="submit" class="btn btn-primary" style="flex: 0 0 30%;">저장
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </form>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <!-- /.container-fluid -->
        </div>
        <!-- End of Main Content -->
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; SOFTCORE 2025</span>
                </div>
            </div>
        </footer>
        <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
</div>
<!-- End of Page Wrapper -->
<!-- Scroll to Top Button-->
<a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
</a>
<!-- Bootstrap core JavaScript-->
{% include '/comm/adscript.html' %}
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
    const quill = new Quill('#editor-container', {
        theme: 'snow'
    });

    document.getElementById('editor-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const clubno = document.getElementById('clubno').value;
        const doctype = document.getElementById('doctype').value;
        const title = document.getElementById('title').value;
        const content = quill.root.innerHTML; // Get HTML content from editor

        // Send data to FastAPI
        const response = await fetch('/updateclubdocs/{{docdtl[0]}}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                clubno: clubno,  // <--- 백엔드로 클럽 번호 전송!
                doctype: doctype,
                title: title,
                content: content
            })
        });

        if (response.redirected) {
            window.location.href = response.url;
        } else {
            const result = await response.json();
            alert(result.message);
        }
    });


    function updateTitle(isInit = false) {
        const selectElement = document.getElementById('doctype');
        const inputElement = document.getElementById('title');
        const selectedOption = selectElement.options[selectElement.selectedIndex].text;

        if (selectElement.value >= '100') {
            // 사용자가 직접 셀렉트박스를 바꾼 경우에만 값을 비웁니다. (초기 로딩 시에는 기존 값 유지)
            if (!isInit) {
                inputElement.value = '';
            }
            inputElement.placeholder = '직접 입력하세요';
            inputElement.readOnly = false;
        } else {
            // 사용자가 직접 셀렉트박스를 바꾼 경우에만 선택한 옵션명으로 덮어씁니다.
            if (!isInit) {
                inputElement.value = selectedOption;
            }
            inputElement.readOnly = true; // 사용자가 수정하지 못하도록 설정
        }
    }

    window.onload = function () {
        // 페이지 로드 시에는 isInit 값을 true로 전달하여 기존 문서 제목이 지워지지 않게 합니다.
        updateTitle(true);
    };
</script>

</body>
</html>
