        function showHtmlViewer(docno) {
            // Set the iframe source to the FastAPI endpoint with the document ID
            const iframe = document.getElementById('popup-iframe');
            iframe.src = `/popup_doc/${docno}`;

            // Display the popup
            const popup = document.getElementById('popup');
            popup.style.display = 'block';
        }

        function closePopup() {
            const popup = document.getElementById('popup');
            popup.style.display = 'none';

            // Clear iframe source to stop loading
            const iframe = document.getElementById('popup-iframe');
            iframe.src = '';
        }
    </script>

            display: none;

<script>
function openSloganImage(clubno) {

    window.open(

    );
}

async function compressImageTo50KB(file) {
    const MAX_BYTES = 50 * 1024; // 50KB
    if (file.size <= MAX_BYTES) return file;

    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                let width = img.width;
                let height = img.height;
                let quality = 0.9;

                // 초기 해상도 조정 (너무 큰 이미지 대비)
                const maxDim = 800;
                if (width > maxDim || height > maxDim) {
                    const ratio = Math.min(maxDim / width, maxDim / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }

                const attemptCompress = () => {
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        // 50KB 이하가 되거나, 더 이상 줄일 수 없을 때까지 반복
                        if (blob.size <= MAX_BYTES || (quality <= 0.1 && width < 100)) {
                            resolve(new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            }));
                        } else {
                            // 용량이 크면 품질과 크기를 동시에 줄임
                            quality -= 0.1;
                            width = Math.round(width * 0.9);
                            height = Math.round(height * 0.9);
                            attemptCompress();
                        }
                    }, 'image/jpeg', Math.max(quality, 0.1));
                };

                attemptCompress();
            };
        };
    });
}

// 2. 클럽 이미지 업로드 처리 함수 (압축 후 백엔드로 전송)
async function uploadClubImage(clubno) {
    const fileInput = document.getElementById('clubImageInput');
    let file = fileInput.files[0];

    if (!file) return; // 취소한 경우

    // 1MB 이상일 경우 알림창 표시
    if (file.size > 1024 * 1024) {
        alert("1MB 이상의 파일입니다. 50KB 이하로 자동 압축하여 업로드합니다.");
    }

    try {
        // 프런트엔드에서 50KB로 압축 진행
        file = await compressImageTo50KB(file);

        // 압축된 파일을 FormData에 담기
        const formData = new FormData();
        formData.append("file", file);

        // 백엔드로 POST 요청 전송
        const response = await fetch(`/clubimage/${clubno}`, {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            alert("클럽 이미지가 성공적으로 업로드되었습니다.");
            // 필요시 페이지 새로고침
            // window.location.reload();
        } else {
            alert("이미지 업로드에 실패했습니다.");
        }
    } catch (error) {
        console.error("Error:", error);
        alert("업로드 중 오류가 발생했습니다.");
    } finally {
        // 같은 파일을 다시 선택해도 이벤트가 발생하도록 input 값 초기화
        fileInput.value = '';
    }
}

</script>
